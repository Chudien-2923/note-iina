name: Verify plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release version agreement
        run: |
          node -e 'const p=require("./package.json");const i=require("./note-iina.iinaplugin/Info.json");if(p.version!==i.version)throw new Error("Package and plugin versions differ");if(process.env.GITHUB_REF_TYPE==="tag"&&process.env.GITHUB_REF_NAME!=="v"+p.version)throw new Error("Tag does not match plugin version");'
      - name: Run behavioral and JavaScriptCore tests
        run: npm test
      - name: Package and verify archive
        run: |
          npm run pack
          VERSION=$(node -p 'require("./package.json").version')
          unzip -t "note-iina-${VERSION}.iinaplgz"
          shasum -a 256 "note-iina-${VERSION}.iinaplgz"
